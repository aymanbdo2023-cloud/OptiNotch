<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190" role="img" aria-label="OptiNotch expanded overlay mockup">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171f"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C93FF"/>
      <stop offset="1" stop-color="#2b5ce0"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="1" stop-color="#3f2bd0"/>
    </linearGradient>
  </defs>

  <!-- Island silhouette: straight top, rounded bottom corners -->
  <path d="M 0 0 H 600 V 156 Q 600 190 566 190 H 34 Q 0 190 0 156 Z"
        fill="url(#glass)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- Header: clock (left), gear (right) -->
  <text x="22" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="600"
        fill="#ffffff" letter-spacing="0.5">10:41</text>
  <g transform="translate(566,20)" fill="#ffffff" opacity="0.7">
    <path d="M8 0c-0.9 0-1.7 0.4-2.3 1L4.6 0.6C3.9 0.2 3 0 2.1 0 1.2 0 0.3 0.2-0.3 0.6L-1.5 1C-2.1 0.4-3 0-3.8 0-5.7 0-7.2 1.5-7.2 3.4c0 0.8 0.3 1.6 0.9 2.2l-1.3 4.8c-0.1 0.3 0 0.6 0.2 0.9l1.1 1.1c0.2 0.2 0.5 0.3 0.8 0.2l3.8-1 0.1 0.1c0.3 0.3 0.8 0.3 1.1 0l0.2-0.2 3.4-0.9c0.3-0.1 0.5-0.4 0.6-0.7l0.3-1.2c0.3-0.1 0.6-0.3 0.9-0.5l1.1 1.1c0.2 0.2 0.5 0.3 0.8 0.2l0.5-0.1 1.1-1.1c0.2-0.2 0.3-0.5 0.2-0.8l-0.6-2.3c0.2-0.3 0.4-0.7 0.5-1l0.7-0.2c0.3-0.1 0.5-0.4 0.6-0.7l0.1-0.5c0-0.3-0.1-0.6-0.3-0.8l-1.1-1.1c-0.2-0.2-0.5-0.3-0.8-0.2l-0.5 0.1c-0.3-0.2-0.7-0.4-1-0.5l-0.3-1.2c-0.1-0.3-0.3-0.5-0.6-0.6L8 0zM8 2.4c0.9 0 1.6 0.7 1.6 1.6S8.9 5.6 8 5.6 6.4 4.9 6.4 4s0.7-1.6 1.6-1.6zM-2 4c0.6 0 1.1 0.5 1.1 1.1S-1.4 6.2-2 6.2 -3.1 5.7-3.1 5.1 -2.6 4-2 4z"
          transform="translate(0,0) scale(1.35) translate(-3.4,0)"/>
  </g>

  <!-- Vertical divider between halves -->
  <line x1="270" y1="44" x2="270" y2="172" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ================= Calendar half (left) ================= -->
  <text x="135" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600"
        fill="#ffffff" text-anchor="middle">August 2026</text>
  <g transform="translate(46,26)" fill="#ffffff" opacity="0.55">
    <polyline points="6,0 0,6 6,12" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </g>
  <g transform="translate(218,26)" fill="#ffffff" opacity="0.55">
    <polyline points="0,0 6,6 0,12" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </g>

  <!-- Weekday header -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)"
     text-anchor="middle">
    <text x="47">Sun</text><text x="77">Mon</text><text x="107">Tue</text>
    <text x="137">Wed</text><text x="167">Thu</text><text x="197">Fri</text><text x="227">Sat</text>
  </g>

  <!-- Single week row of dates -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff">
    <circle cx="77" cy="63" r="10" fill="#5C93FF"/>
    <text x="77" y="67" text-anchor="middle" fill="#081120">2</text>
    <text x="107" y="67" text-anchor="middle">3</text>
    <text x="137" y="67" text-anchor="middle">4</text>
    <text x="167" y="67" text-anchor="middle">5</text>
    <text x="197" y="67" text-anchor="middle">6</text>
    <text x="227" y="67" text-anchor="middle">7</text>
  </g>

  <!-- Events -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <circle cx="47" cy="94" r="2.5" fill="#5C93FF"/>
    <text x="56" y="98" font-size="11" fill="#ffffff">Standup with the team</text>
    <text x="238" y="98" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">9:00</text>

    <circle cx="47" cy="116" r="2.5" fill="#8f6bff"/>
    <text x="56" y="120" font-size="11" fill="#ffffff">Design review</text>
    <text x="238" y="120" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">13:30</text>

    <circle cx="47" cy="138" r="2.5" fill="#2fe0a4"/>
    <text x="56" y="142" font-size="11" fill="#ffffff">Ship OptiNotch v1.0</text>
    <text x="238" y="142" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">17:00</text>
  </g>

  <!-- ================= Media half (right) ================= -->
  <!-- Album art -->
  <rect x="290" y="56" width="64" height="64" rx="10" fill="url(#art)"/>
  <path d="M300 96l8-10 6 8 5-6 9 8z" fill="rgba(255,255,255,0.25)"/>
  <circle cx="316" cy="72" r="7" fill="rgba(255,255,255,0.85)"/>

  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="366" y="82" font-size="14" font-weight="600" fill="#ffffff">Midnight Drive</text>
    <text x="366" y="100" font-size="12" fill="rgba(255,255,255,0.65)">Nova Skies</text>
    <text x="366" y="116" font-size="11" fill="rgba(255,255,255,0.4)">Neon Horizon</text>
  </g>

  <!-- Progress bar -->
  <rect x="290" y="134" width="268" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="290" y="134" width="158" height="3" rx="1.5" fill="#5C93FF"/>
  <circle cx="448" cy="135.5" r="4.5" fill="#5C93FF"/>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">
    <text x="290" y="154">2:04</text>
    <text x="558" y="154" text-anchor="end">4:42</text>
  </g>

  <!-- Controls -->
  <g fill="#ffffff" opacity="0.65">
    <path d="M336 158l8 5 -8 5z" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="344" y="158" width="1.6" height="10" rx="0.8" transform="translate(0,0)"/>
    <rect x="349" y="158" width="1.6" height="10" rx="0.8"/>
  </g>
  <circle cx="384" cy="163" r="10" fill="#5C93FF"/>
  <path d="M380 158.5l8 4.5 -8 4.5z" fill="#081120"/>
  <g fill="#ffffff" opacity="0.65">
    <path d="M410 163l8 5 -8 5z" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="418" y="158" width="1.6" height="10" rx="0.8"/>
    <rect x="423" y="158" width="1.6" height="10" rx="0.8"/>
  </g>
</svg>
